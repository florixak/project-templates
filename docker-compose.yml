services:
  web:
    build:
      context: .
      target: development
    ports:
      - '3000:3000'
    env_file:
      - .env.example
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    restart: unless-stopped

  web-prod:
    profiles: ['prod']
    build:
      context: .
      target: runner
    ports:
      - '3000:3000'
    env_file:
      - .env.example
    restart: unless-stopped

volumes:
  web_node_modules:
